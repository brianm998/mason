// SPDX-License-Identifier: GPL-3.0-or-later
//
// The MASON client protocol (Part 16). One schema generates Rust (prost),
// Swift (swift-protobuf) and Kotlin (Wire). One WebSocket carries commands and
// subscriptions; the daemon computes every view, so clients draw what they are
// given and send commands, and never re-derive pipeline rules.
//
// Compatibility: field numbers are never reused or renumbered; new fields are
// added with new numbers; a client ignores fields it does not know.

syntax = "proto3";

package mason.v1;

// The protocol version a server and client speak. Bumped only for a change
// that an older peer cannot ignore.
message Version {
  uint32 major = 1;
}

// ---- client -> server ------------------------------------------------------

message ClientMessage {
  oneof body {
    Hello hello = 1;
    Command command = 2;
    Subscribe subscribe = 3;
    Ping ping = 4;
  }
}

// The first thing a client sends. `last_seq` is the last event sequence number
// it has seen (0 for a new client): the server answers with a snapshot or just
// the events it missed.
message Hello {
  uint32 protocol = 1;
  uint64 last_seq = 2;
  string client = 3;
  // Reserved for pairing (Stage 24). Ignored on loopback.
  string token = 4;
  // The command line asks for no views and no pushes: just to send commands.
  bool commands_only = 5;
  // The monitor's own build (a commit, or "dev"), so the daemon can say whether
  // a newer one exists.
  string client_version = 6;
  // Who this connection acts as. The daemon says in Welcome.owner whether that
  // is the owner, so a monitor can hide the buttons only the owner may use.
  string actor = 7;
}

enum ViewKind {
  VIEW_UNSPECIFIED = 0;
  HEADER = 1;
  SIDEBAR = 2;
  HOME = 3;
  TASK_DETAIL = 4;
  LANDING = 5;
  USAGE = 6;
  EDITOR = 7;
}

// Which views to keep sending. Replaces any earlier subscription.
message Subscribe {
  repeated ViewKind views = 1;
  // Only tasks of this project (empty: all projects).
  string project = 2;
  // The task for TASK_DETAIL.
  uint64 task = 3;
  // The step selected in the editor, for EDITOR's inspector (empty: none).
  string editor_step = 4;
}

message Ping {
  uint64 nonce = 1;
}

// A command. The server answers with a CommandResult carrying the same id.
// Typed commands are the ones a monitor offers; `raw` reaches the rest of the
// API for the command line and for debugging.
message Command {
  string id = 1;
  oneof body {
    AddTask add_task = 2;
    TaskRef cancel = 3;
    Retry retry = 4;
    TaskRef approve = 5;
    Reject reject = 6;
    TaskRef explore_anyway = 7;
    Answer answer = 8;
    Skip skip = 9;
    TaskRef land_now = 10;
    TaskRef force = 11;
    PauseWork pause = 12;
    ResumeWork resume = 13;
    SetLimit set_limit = 14;
    // Approve a held self-change: the exact diff the owner was shown.
    ApproveHold approve_hold = 15;
    // Release a held task from some or all of its blockers, add blockers, or put
    // a canceled task whose branch was kept back in the queue. Owner only.
    Unblock unblock = 16;
    Block block = 17;
    TaskRef revive = 18;
    Raw raw = 30;
  }
  // Who is acting and, optionally, why (recorded with overrides).
  string actor = 40;
  string reason = 41;
}

message TaskRef {
  uint64 task = 1;
}

message Unblock {
  uint64 task = 1;
  // The blockers to release; empty with `all` released every one.
  repeated uint64 from = 2;
  bool all = 3;
}

message Block {
  uint64 task = 1;
  repeated uint64 after = 2;
}

message AddTask {
  string project = 1;
  string title = 2;
  string body = 3;
  string priority = 4;
  bool proposed = 5;
  bool explored = 6;
  // Tasks this one waits for, by id (additive). Landed ones are already satisfied;
  // a canceled or failed one is refused.
  repeated uint64 after = 7;
}

message Retry {
  uint64 task = 1;
  // A step name or category; empty means the first developing step.
  string from = 2;
  // The run the client was showing (`TaskRow.last_run`); 0: not given. If the task has
  // a newer run the retry is refused as already done. Additive.
  uint64 seen = 3;
  // Restart a step that is running (without `seen`). Additive.
  bool restart = 4;
}

message Reject {
  uint64 task = 1;
  string reason = 2;
}

message Answer {
  uint64 task = 1;
  // An option number, an option label, or free text (the "Other" box).
  string answer = 2;
  // The hash of the card the answerer was looking at: a stale one is refused.
  string card_hash = 3;
}

message ApproveHold {
  uint64 task = 1;
  // The diff hash the owner was shown. A hold for another diff refuses (409).
  string diff_hash = 2;
}

message Skip {
  uint64 task = 1;
  oneof scope {
    string suite = 2;
    string step = 3;
  }
  bool deferred = 4;
}

message PauseWork {
  string project = 1;
  string mode = 2;
  uint64 for_seconds = 3;
}

message ResumeWork {
  string project = 1;
  string mode = 2;
}

message SetLimit {
  string resource = 1;
  uint32 units = 2;
}

// Any other operation of the API, by HTTP-style method and path, with a JSON
// body. The answer's JSON is in CommandResult.json.
message Raw {
  string method = 1;
  string path = 2;
  string json = 3;
}

// ---- server -> client ------------------------------------------------------

message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Snapshot snapshot = 2;
    Events events = 3;
    ViewUpdate view = 4;
    CommandResult result = 5;
    Pong pong = 6;
    Error error = 7;
    // A running step's progress moved (additive; older clients skip it).
    StepProgress step_progress = 8;
  }
}

enum ResumeKind {
  RESUME_UNSPECIFIED = 0;
  // The client already has everything.
  UP_TO_DATE = 1;
  // Only the events after `last_seq` follow.
  EVENTS = 2;
  // The client is new, or too far behind: a snapshot follows.
  SNAPSHOT = 3;
}

message Welcome {
  uint32 protocol = 1;
  // The newest event sequence number the daemon has.
  uint64 seq = 2;
  ResumeKind resume = 3;
  string daemon = 4;
  bool demo = 5;
  // The daemon's build: the commit of the runtime it runs from, or "dev".
  // A monitor with a different, real version offers to update itself.
  string version = 6;
  // The oldest client protocol this daemon serves. A monitor older than that
  // stays read-only and says why.
  uint32 min_protocol = 7;
  // True when the Hello.actor is one of the owner's identities.
  bool owner = 8;
  // The daemon's own clock, ms since the epoch: a monitor counts "updated 4 s
  // ago" from the absolute times in progress records against this, correctly
  // even when its clock and the daemon's differ.
  uint64 now_ms = 9;
  // "owner" or "viewer" on the LAN listener (the role of the paired device's token);
  // empty on loopback, where the Hello.actor rule above applies. Additive (s24).
  string role = 10;
}

// One running step's progress, pushed when it moves (at most once a second for
// output alone, at once for a count, message or state change). Views carry the
// same record in `ProgressCell`.
message StepProgress {
  uint64 seq = 1;
  uint64 task = 2;
  uint64 run = 3;
  string step = 4;
  ProgressCell progress = 5;
  // The daemon's clock when this was sent (ms since the epoch).
  uint64 now_ms = 6;
  // Whole output lines that arrived since the last push, oldest first (at most 40):
  // the live log follows these instead of being read again.
  repeated string log = 7;
}

message Snapshot {
  uint64 seq = 1;
  repeated View views = 2;
}

message Events {
  repeated EventRecord events = 1;
}

message EventRecord {
  uint64 seq = 1;
  uint64 at_ms = 2;
  string kind = 3;
  string summary = 4;
  // The task it is about, if any.
  uint64 task = 5;
}

message ViewUpdate {
  uint64 seq = 1;
  View view = 2;
}

message CommandResult {
  string id = 1;
  bool ok = 2;
  // The error text when !ok, in words a person can act on.
  string error = 3;
  // The HTTP-style status code of the underlying operation.
  uint32 status = 4;
  string json = 5;
}

message Pong {
  uint64 nonce = 1;
}

message Error {
  string message = 1;
}

// ---- views -----------------------------------------------------------------

message View {
  oneof body {
    HeaderView header = 1;
    SidebarView sidebar = 2;
    HomeView home = 3;
    TaskDetailView task_detail = 4;
    LandingView landing = 5;
    UsageView usage = 6;
    EditorView editor = 7;
  }
}

enum CellState {
  CELL_UNSPECIFIED = 0;
  // Not started.
  EMPTY = 1;
  // Part filled: a real count, or the typical time when there is no count.
  PART = 2;
  // Finished.
  FILLED = 3;
  // Waiting, labelled with what for.
  HATCHED = 4;
}

message ProgressCell {
  string step = 1;
  CellState state = 2;
  // What it is waiting for, or a count like "212 of 340 tests".
  string label = 3;
  uint32 done = 4;
  uint32 total = 5;
  // Additive from here. What `done` and `total` count, in words ("lines",
  // "tests"); empty when nothing is counted.
  string unit = 6;
  ProgressSource done_source = 7;
  // A HISTORY total is the typical figure from past runs, never a real total.
  ProgressSource total_source = 8;
  // The step's latest one-line "what I am doing now", if it gave one.
  string message = 9;
  // Output so far, from the step host's journal.
  uint64 lines = 10;
  uint64 bytes = 11;
  // Absolute times, ms since the epoch (0 for none): the last output, the
  // step run's start, and the last time anything in the record moved.
  uint64 last_output_ms = 12;
  uint64 started_ms = 13;
  uint64 updated_at_ms = 14;
  // The step run this record is of (0 when the cell has no run).
  uint64 run = 15;
  // Additive: the counts inside a step (suites, checks, batch phases).
  repeated ProgressSub subs = 16;
  // The agent's todo list, in order.
  repeated TodoItem todo = 17;
  // With a HISTORY total: the low end of the typical range (`total` is the high end).
  uint32 total_low = 18;
  // How many past runs the typical figures come from.
  uint32 history_samples = 19;
  // The quiet time after which this step is shown as silent: from past runs, else 300 s.
  uint64 stale_after_ms = 20;
  // Tokens the step run's LLM sessions have used so far, summed over its resumed and
  // retried invocations. Absent: nothing reported yet (never zero). Only `has_*` figures
  // were reported; cost is present only for an api account.
  TokenLine tokens = 21;
}

// One count inside a step.
message ProgressSub {
  string name = 1;
  string unit = 2;
  uint32 done = 3;
  uint32 total = 4;
  ProgressSource done_source = 5;
  ProgressSource total_source = 6;
}

// One item of an agent's todo list.
message TodoItem {
  string text = 1;
  // "pending", "doing" or "done".
  string status = 2;
}

// Where a figure came from.
enum ProgressSource {
  SOURCE_NONE = 0;
  // The step said so.
  SOURCE_REPORTED = 1;
  // The daemon counted it.
  SOURCE_COUNTED = 2;
  // The typical figure from this project's past successful runs.
  SOURCE_HISTORY = 3;
  // The count the suite is expected to reach: the last green run's (s70).
  SOURCE_EXPECTED = 4;
  // The suite's declared minimum number of tests (s70).
  SOURCE_MINIMUM = 5;
}

// A task as every view shows it. `allowed_actions` is the one list of what
// can be done to it now; a command not in it is refused.
message TaskRow {
  uint64 id = 1;
  string key = 2;
  string title = 3;
  string project = 4;
  string state = 5;
  string activity = 6;
  // Why it is waiting, in the form "Waiting for compile slot: 2nd in line, held by #91 for 4 min".
  // Who is ahead in line is not named; `mason resources` lists them.
  string why_waiting = 7;
  uint64 enqueued_ms = 8;
  uint64 in_state_ms = 9;
  string model = 10;
  repeated ProgressCell progress = 11;
  repeated string allowed_actions = 12;
  repeated uint64 blockers = 13;
  // "usually 15 to 20 min", only with enough history to say.
  string typical = 14;
  // Running past the typical time: amber, never red.
  bool slow = 15;
  string step = 16;
  // The task's text, for search (the sidebar search can match the body).
  string body = 17;
  // Tasks that wait for this one (the reverse of `blockers`).
  repeated uint64 blocks = 18;
  // The tier and the real model in use, as one string made by the daemon:
  // "deep (Opus medium)". Clients show it as it is and map nothing themselves.
  string display = 19;
  // The same, in parts.
  ModelUse model_use = 20;
  // For a proposal or an improvement: "agent · blocks · pipeline" (source, severity, route).
  string proposal = 21;
  // The tracker issue this task was imported from (0 when it was not).
  uint64 issue = 22;
  // Where to read it ("" when the tracker has no public page).
  string issue_url = 23;
  // Each blocker with its state, where it came from ("from GitHub" or "set by you")
  // and what the owner can do about it ("release", "revive", "retry"). Additive.
  repeated BlockerLink blocker_links = 24;
  // The task's latest step run (0: none yet). A retry sends it back as `Retry.seen`. Additive.
  uint64 last_run = 25;
}

message BlockerLink {
  uint64 task = 1;
  string state = 2;
  string origin = 3;
  repeated string actions = 4;
}

// What a step run launched (or, with `expected`, will launch): the tier
// and level asked for, the real model and effort passed to the CLI, and
// where each came from. The daemon makes `display`; every client shows it.
message ModelUse {
  string display = 1;
  string tier = 2;
  string level = 3;
  // The real model shown: the one the CLI reported when it reported one that
  // differs from the one asked for, else the one asked for. Empty: the CLI's default.
  string model = 4;
  string effort = 5;
  string provider = 6;
  // Where the model and the effort came from, in words.
  string why = 7;
  // launch, retry, resume or reattach.
  string kind = 8;
  uint32 retry_n = 9;
  uint32 retry_max = 10;
  // Not launched yet: what the step is expected to use.
  bool expected = 11;
  uint64 run = 12;
  // The model passed to the CLI, and the one the CLI reported, when it did.
  string requested_model = 13;
  string reported_model = 14;
  // The owner's override named the model or the effort.
  bool overridden = 15;
  uint64 at_ms = 16;
}

message StateCount {
  string state = 1;
  uint32 count = 2;
  // A state that wants the owner is tinted.
  bool wants_you = 3;
  string tooltip = 4;
  // The text on the tile; empty from an older daemon.
  string label = 5;
}

message Banner {
  string kind = 1;
  string text = 2;
}

message HeaderView {
  // How many things need the owner.
  uint32 attention = 1;
  repeated StateCount counts = 2;
  repeated Banner banners = 3;
  repeated string projects = 4;
  string status = 5;
  // MASON's own repository, if one is registered: where "Improve the pipeline" files its task.
  string self_project = 6;
  // Open issues the tracker has not imported (or whose task was canceled), with why.
  repeated PendingIssue pending_issues = 7;
  // Whether MASON itself is behind its update channel, and any update under way
  // (additive). Absent when the daemon has no update.toml.
  UpdateInfo update = 8;
}

// What the daemon found the last time it looked at its update channel.
message UpdateInfo {
  // The sentence about the daemon to show; empty when there is nothing to say.
  string daemon_text = 1;
  // The owner can press "Update masond" now.
  bool daemon_can_update = 2;
  // One per kind of desktop monitor the daemon can build.
  repeated MonitorBuild monitors = 3;
}

message MonitorBuild {
  // "swift" or "compose".
  string kind = 1;
  // The newest commit on the channel that changed this monitor. A monitor is
  // stamped with this commit when it is built, so a different stamp means it is behind.
  string latest = 2;
  // "" (nothing asked for), "building", "ready" or "failed".
  string phase = 3;
  string error = 4;
  // When ready: the finished build, on the daemon's own disk.
  string path = 5;
}

message PendingIssue {
  string project = 1;
  uint64 number = 2;
  string title = 3;
  string reason = 4;
  string url = 5;
}

message SidebarSection {
  string state = 1;
  string title = 2;
  uint32 count = 3;
  // Failed, landed and canceled start collapsed.
  bool collapsed = 4;
  repeated TaskRow rows = 5;
}

// Tasks per state, already sorted: queued in queue order (the task the daemon
// admits next on top); every other state with the task that entered it most
// recently on top.
message SidebarView {
  repeated SidebarSection sections = 1;
  repeated string pages = 2;
}

message CardOption {
  string label = 1;
  bool recommended = 2;
}

message DecisionCard {
  string ask = 1;
  string why = 2;
  repeated CardOption options = 3;
  repeated string evidence = 4;
  string hash = 5;
  string origin = 6;
}

// What a task waiting for the owner's approval is waiting on, in full.
message Approval {
  // "proposed", "approval" (an approval step) or "hold" (a self-hosting hold).
  string kind = 1;
  string waiting_for = 2;
  // The touched gate and trust files, the broadened skips, one per line.
  repeated string lines = 3;
  // The hash of the held diff; Approve sends it back. Empty unless a hold.
  string diff_hash = 4;
  string branch = 5;
  // A command that shows the diff.
  string diff_command = 6;
}

message AttentionItem {
  TaskRow task = 1;
  DecisionCard card = 2;
  Approval approval = 3;
}

message ActiveModel {
  string model = 1;
  string project = 2;
  uint64 task = 3;
  string step = 4;
  // "deep (Opus medium)"; the old `model` stays for older clients.
  string display = 5;
  ModelUse model_use = 6;
}

message HomeView {
  string status = 1;
  repeated AttentionItem attention = 2;
  repeated ActiveModel active = 3;
  // LLM sessions: held and the limit (the stepper).
  uint32 sessions_used = 4;
  uint32 sessions_limit = 5;
  // The tasks in each stage, for the "detail for tasks in each stage" part.
  repeated SidebarSection stages = 6;
  // The `compile` resource: what holds it, what waits and why, and its limit.
  Compilation compilation = 7;
}

// Who holds a `compile` slot.
message CompileHolder {
  // `#88`, or the command line of an interactive caller.
  string label = 1;
  // The task it is for; 0 for a person's command or a slot held outside the queue.
  uint64 task = 2;
  uint64 since_ms = 3;
  bool interactive = 4;
  // How long its processes have used almost no CPU (0: busy, or not read yet).
  // A task's command idle past `[cpu] compile_idle_kill_s` is stopped.
  uint64 idle_ms = 5;
}

// A request waiting for a `compile` slot, in line order.
message CompileWaiter {
  string label = 1;
  uint64 task = 2;
  uint64 since_ms = 3;
  // 1 is next in line.
  uint32 position = 4;
  // Why it waits, in words: "every slot is held", "CPU 72% busy (starts below 50%)".
  string reason = 5;
  // The same as a code: full, behind, cpu, settling, disk-stall, disk, memory,
  // exclusive, too-big, unknown.
  string cause = 6;
  bool interactive = 7;
  // Steps from landing, which orders pipeline work; 0 for an interactive caller.
  uint32 steps_remaining = 8;
  // A landing's verification: first among pipeline work, and not held by the CPU.
  bool landing = 9;
}

message Compilation {
  // How many compiles may run at once, and how many do. `SetLimit` with
  // resource "compile" changes the limit.
  uint32 limit = 1;
  uint32 used = 2;
  repeated CompileHolder running = 3;
  repeated CompileWaiter pending = 4;
  // Overall CPU use; -1 when it cannot be read.
  int32 cpu_busy_pct = 5;
  // A further compile starts only while CPU use is below this (the first always starts).
  uint32 cpu_max_pct = 6;
  // Seconds between compile starts (0: not paced).
  uint32 settle_s = 7;
  // The rules, in one line, for the section's footnote.
  string rules = 8;
  // Where the CPU reading comes from: mach, proc, top, or, when that is missing,
  // loadavg or assumed-busy. Empty from a daemon that does not say.
  string cpu_source = 9;
  // What the daemon did about the queue lately, newest first ("Stopped #95's
  // command ...: it used no CPU for 30 min while holding a compile slot").
  repeated string notes = 10;
}

message StepLine {
  uint64 run = 1;
  string name = 2;
  string category = 3;
  uint32 attempt = 4;
  string outcome = 5;
  uint64 started_ms = 6;
  // Every session this run started: the first, resumes, and each ladder retry.
  repeated ModelUse launches = 7;
}

message DebtLine {
  uint64 id = 1;
  uint64 task = 2;
  string scope = 3;
  string status = 4;
  string reason = 5;
  bool deferred = 6;
}

message TaskDetailView {
  TaskRow row = 1;
  repeated StepLine steps = 2;
  string plan = 3;
  DecisionCard card = 4;
  // The closing verdict and why, once there is one.
  string closing = 5;
  repeated DebtLine debts = 6;
  string log_tail = 7;
  string branch = 8;
  string worktree = 9;
  string definition = 10;
  string failure = 11;
  string body = 12;
  // How the task started and why exploring was or was not skipped, in words.
  string route = 13;
  // Where it started: the step name.
  string started_at = 14;
  // Times the developing agent sent it back to exploring, at no cost.
  uint32 explore_returns = 15;
  Approval approval = 17;
  // The numbers MASON reserved for the task's stage note, exit script and decision record.
  repeated NumberLine numbers = 18;
  // The plan, parsed by the daemon so the clients do no JSON work. `plan` (3) stays for older clients.
  PlanView plan_view = 19;
  // Present for a proposal or an improvement the owner asked for.
  ProposalInfo proposal = 20;
  // Tokens and cost this task's steps reported, one line per step (s64).
  repeated TokenLine step_tokens = 21;
  // Where CI can be read for this task's landing: the batch's pull request and each failed
  // check. Only http(s) URLs are sent. Additive; an older daemon sends none.
  repeated CiLink ci_links = 22;
}

// A page on the git host a client opens in the browser. `label` is exactly the text the
// task's notes use ("PR #123", a check's name), so a client can link that text.
message CiLink {
  string label = 1;
  string url = 2;
  // "pull_request", "check" or "run".
  string kind = 3;
}

// What was noticed, by whom, with the proof; and for an improvement, where its branch is.
message ProposalInfo {
  // "agent", "outside" or "owner".
  string source = 1;
  // "normal" or "blocks".
  string severity = 2;
  // "project" or "pipeline" (MASON's own repository).
  string route = 3;
  // What the agent saw: files, lines, output.
  string evidence = 4;
  // The proposal's own text, without the evidence (what the edit sheet starts from).
  string text = 5;
  // The task whose agent filed it; 0 if nobody's.
  uint64 filed_by = 6;
  // "open", "approved" or "rejected", and why if rejected.
  string status = 7;
  string reject_reason = 8;
  // "local", "previewed" or "published".
  string publish_state = 9;
  // An improvement: "write" or "fork"; the branch; the upstream pull request and its state.
  string access = 10;
  string branch = 11;
  uint64 pr = 12;
  string pr_state = 13;
  // The update channel when the daemon follows this improvement's branch.
  string channel = 14;
}

// A task's exploration plan as readable parts.
message PlanView {
  // The summary split on blank lines.
  repeated string summary_paragraphs = 1;
  // True when the approach was a numbered or bulleted list: `steps` are then list items.
  // False: `steps` are the approach's paragraphs.
  bool steps_are_list = 2;
  repeated string steps = 3;
  // Text before the first list marker of the approach.
  string lead = 4;
  repeated string files = 5;
  repeated string criteria = 6;
  repeated PlanExtra other = 7;
  // The original JSON, for copying.
  string raw = 8;
  // Set when the plan could not be read as a plan: then only `raw` and this are filled.
  string note = 9;
  // Each step's own number as the agent wrote it ("0", "1", ...), one per step, when the approach was a
  // numbered list. Empty for a bulleted list (show a bullet) and for paragraphs.
  repeated string step_numbers = 10;
}

// An extra key of the plan: label and an already readable value.
message PlanExtra {
  string label = 1;
  string value = 2;
}

// One number handed to a task. A cancelled task's numbers are shown released: never reused.
message NumberLine {
  // "exit" (the stage note and exit script share it) or "decision".
  string kind = 1;
  uint32 number = 2;
  bool released = 3;
  string path = 4;
  // "reserved", or "stage" when the task kept the stage its title names.
  string source = 5;
}

// A batch the landing engine formed, and where it is.
message BatchLine {
  uint64 id = 1;
  string project = 2;
  // forming, merged, verifying, red, promoting, landed, parked, failed, abandoned
  string phase = 3;
  repeated uint64 tasks = 4;
  repeated uint64 landed = 5;
  repeated uint64 parked = 6;
  string note = 7;
  bool running = 8;
}

// A project whose post-land tier went red: only the fix may land.
message FreezeLine {
  string project = 1;
  string reason = 2;
  uint64 fix_task = 3;
  uint64 since_ms = 4;
}

message LandingView {
  repeated DebtLine debts = 1;
  bool frozen = 2;
  string note = 3;
  repeated TaskRow queue = 4;
  // How each project lands, in words: mode, window, size, batches at once.
  repeated string modes = 5;
  repeated BatchLine batches = 6;
  repeated FreezeLine freezes = 7;
  // Milliseconds tasks waited while no batch was running.
  uint64 queue_idle_ms = 8;
  // One line per project: tracker off, polling (with counts), or stopped (with why).
  repeated string trackers = 9;
}

message ProviderStatus {
  string name = 1;
  string status = 2;
  uint32 sessions_used = 3;
  uint32 sessions_limit = 4;
  // The account's configuration (providers.toml).
  string adapter = 5;            // "claude" | "codex"
  string billing = 6;            // "subscription" | "api"
  double warn_at = 7;            // fraction of a limit at which to warn
  string overage = 8;            // "allow" | "hold"
  double monthly_budget_usd = 9; // api accounts; 0 when none is set
  // What the provider last said (s64). Every figure comes with its age text.
  // The slots are sessions_used / sessions_limit above.
  repeated UsageWindow windows = 10;
  string overage_text = 11;   // "overage: off (why)", "in use since ...", or ""
  string blocked_text = 12;   // "blocked: why, until ..." or ""
  bool has_snapshot = 13;     // false: nothing reported yet
  uint64 as_of = 14;          // epoch seconds of the snapshot
  string age = 15;            // "as of 12 min ago", "just now"; "" without a snapshot
  SpendView spend = 16;       // api accounts only
  UsageTokens tokens_window = 17; // the current (shortest reported) window; empty without one
  UsageTokens tokens_week = 18;   // the last 7 days
  string doing = 19;          // what MASON is doing about it; "nothing" until ticket 4
  // The same as `adapter` (5). Wire's Kotlin classes already have a member called
  // `adapter`, so a client there cannot read a field of that name; it reads this one.
  string adapter_name = 20;
}

// One limit window. A window reported without a percentage has
// has_percent = false and shows its state and reset only.
message UsageWindow {
  string id = 1;
  string label = 2;
  bool reported = 3;     // false: the adapter can report it, nothing has yet
  bool has_percent = 4;
  double percent = 5;    // 0..100, only when has_percent
  bool has_reset = 6;
  uint64 resets_at = 7;  // epoch seconds
  string resets_text = 8; // "resets in 2 h 14 m, at 15:00 UTC"
  string state = 9;      // "ok" | "warning" | "blocked"
  string trend = 10;     // "up 12 points over 6 h 0 m" or ""
  string age = 11;
  string short_text = 12; // top bar: "5-hour 82%, resets 1 h 10 m"
}

message SpendView {
  bool has_spend = 1;     // false: no cost reported yet
  double today_usd = 2;
  double week_usd = 3;
  double month_usd = 4;
  bool has_budget = 5;
  double budget_usd = 6;
  string age = 7;
}

// Reported tokens and cost. A has_* flag false means not reported (never 0).
message TokenLine {
  string name = 1;
  bool has_input = 2;
  uint64 input = 3;
  bool has_output = 4;
  uint64 output = 5;
  bool has_cache_read = 6;
  uint64 cache_read = 7;
  bool has_cache_write = 8;
  uint64 cache_write = 9;
  bool has_cost = 10;
  double cost_usd = 11;
  uint32 attempts = 12;
  string age = 13;        // of the newest attempt counted
  uint64 task = 14;       // top tasks only
}

message UsageTokens {
  string period = 1;      // "current window" | "last 7 days"
  repeated TokenLine by_project = 2;
  repeated TokenLine by_model = 3;
  repeated TokenLine top_tasks = 4;
}

message UsageView {
  repeated ProviderStatus providers = 1;
  string note = 2;
  // The top-bar line: the most constrained window per account.
  repeated string top_bar = 3;
}

message StepNode {
  string name = 1;
  string kind = 2;
  string category = 3;
  repeated string next = 4;
  string on_red = 5;
}

message EditorLane {
  string category = 1;
  string title = 2;
}

message EditorNode {
  string name = 1;
  string kind = 2;
  string category = 3;
  uint32 lane = 4;
  sint64 x = 5;
  sint64 y = 6;
  // Placed by hand (it is in the sidecar file).
  bool placed = 7;
  repeated string problems = 8;
  // A short line: the agent, the suites, the command.
  string summary = 9;
  bool is_start = 10;
}

message EditorEdge {
  string from = 1;
  string to = 2;
  // "next" (on success) or "on_red" (go back).
  string kind = 3;
  // For a loop back: how many times (0: not a loop).
  uint32 bound = 4;
}

message GridRowView {
  string suite = 1;
  string level = 2;
  // One per column of the grid.
  repeated bool cells = 3;
}

// Suites as rows, the points where a level can run as columns.
message TestGridView {
  repeated string columns = 1;
  repeated GridRowView rows = 2;
  repeated string levels = 3;
}

// The form of the selected step. `schema` is a JSON Schema and `values` the values
// it holds, both JSON text: a client builds the form from the schema alone.
message Inspector {
  string step = 1;
  string kind = 2;
  string schema = 3;
  string values = 4;
  // For an agent step, what it would launch now under the current provider:
  // "deep at high -> Opus max"; empty for any other step.
  string launch = 5;
  // Where each part came from, one short line.
  string launch_from = 6;
}

message EditorView {
  string project = 1;
  // The draft's pipeline, as TOML.
  string text = 2;
  repeated StepNode steps = 3;
  // Problems of the draft that belong to no node.
  repeated string problems = 4;
  string hash = 5;
  repeated EditorLane lanes = 6;
  repeated EditorNode nodes = 7;
  repeated EditorEdge edges = 8;
  TestGridView grid = 9;
  Inspector inspector = 10;
  // The landing settings, as JSON text (mode, batch rules, tiers, red ladder, choices).
  string landing = 11;
  // The step types of the palette, each as JSON text.
  repeated string palette = 12;
  repeated string suites = 13;
  repeated string step_names = 14;
  bool dirty = 15;
  bool can_undo = 16;
  bool can_redo = 17;
  // The draft's changes as a unified diff, and in words.
  string diff = 18;
  repeated string changes = 19;
  // "2 tasks in this step will finish on the old version".
  repeated string affected = 20;
  // The last simulation, as JSON text.
  string simulation = 21;
  // Why the last edit was refused.
  repeated string last_error = 22;
  string selected = 23;
  // This is MASON's own repository: its `.mason/` is protected.
  bool protected = 24;
}
