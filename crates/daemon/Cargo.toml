# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "mason-daemon"
description = "The MASON daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "mason_daemon"
path = "src/lib.rs"

[[bin]]
name = "masond"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
mason-adapter-api = { version = "0.0.0", path = "../adapter-api" }
mason-adapters = { version = "0.0.0", path = "../adapters" }
mason-core = { version = "0.0.0", path = "../core" }
mason-devices = { version = "0.0.0", path = "../devices" }
mason-definition = { version = "0.0.0", path = "../definition" }
mason-engine = { version = "0.0.0", path = "../engine" }
mason-plugins = { version = "0.0.0", path = "../plugins" }
mason-landing = { version = "0.0.0", path = "../landing" }
mason-protocol = { version = "0.0.0", path = "../protocol" }
mason-resources = { version = "0.0.0", path = "../resources" }
mason-scheduler = { version = "0.0.0", path = "../scheduler" }
mason-step-host = { version = "0.0.0", path = "../step-host" }
mason-store = { version = "0.0.0", path = "../store" }
mason-testing = { version = "0.0.0", path = "../testing" }
nix = { version = "0.31.3", features = ["process", "signal", "hostname", "fs"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
toml_edit = "0.25.18"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
sha2 = "0.10"
rcgen = "0.12"
mdns-sd = "0.11"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
hyper = "1"
tower-service = "0.3"

[dev-dependencies]
mason-conformance = { version = "0.0.0", path = "../conformance" }
rusqlite = "0.41.1"
tempfile = "3.27.0"
