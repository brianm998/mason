# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "mason-onboard"
description = "MASON project setup: the logic of `mason init` and `mason adopt`, without a terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mason-adapter-api = { version = "0.1.0", path = "../adapter-api" }
mason-adapters = { version = "0.1.0", path = "../adapters" }
mason-definition = { version = "0.1.0", path = "../definition" }
mason-landing = { version = "0.1.0", path = "../landing" }
mason-testing = { version = "0.1.0", path = "../testing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
toml_edit = "0.25.18"

[dev-dependencies]
tempfile = "3.27.0"
