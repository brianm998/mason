# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "mason-pipeline"
description = "MASON command line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false # flipped at Stage 31 after owner approval

[lints]
workspace = true

[[bin]]
name = "mason"
path = "src/main.rs"

[dependencies]
mason-adapters = { version = "0.1.0", path = "../adapters" }
mason-daemon = { version = "0.1.0", path = "../daemon" }
mason-definition = { version = "0.1.0", path = "../definition" }
mason-landing = { version = "0.1.0", path = "../landing" }
mason-core = { version = "0.1.0", path = "../core" }
mason-protocol = { version = "0.1.0", path = "../protocol" }
mason-resources = { version = "0.1.0", path = "../resources" }
mason-testing = { version = "0.1.0", path = "../testing" }
mason-step-host = { version = "0.1.0", path = "../step-host" }
mason-platform = { version = "0.1.0", path = "../platform" }
serde_json = "1.0.154"
toml_edit = "0.25.18"

[dev-dependencies]
tempfile = "3.27.0"
