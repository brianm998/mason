[package]
name = "mason-pipeline"
description = "MASON command line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false # flipped at Stage 31 after owner approval

[lints]
workspace = true

[[bin]]
name = "mason"
path = "src/main.rs"

[dependencies]
mason-daemon = { version = "0.0.0", path = "../daemon" }
mason-landing = { version = "0.0.0", path = "../landing" }
mason-step-host = { version = "0.0.0", path = "../step-host" }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
