# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "mason-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mason-adapter-api = { version = "0.0.0", path = "../adapter-api" }
mason-step-host = { version = "0.0.0", path = "../step-host" }
nix = { version = "0.31.3", features = ["process", "signal"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1"

[lib]
name = "mason_adapters"
path = "src/lib.rs"

# MCP stdio bridge: exposes the step contract's tools to an agent CLI and
# forwards each call to the contract socket.
[[bin]]
name = "mason-mcp"
path = "src/bin/mason-mcp.rs"

# A scripted stand-in for the `claude` CLI. It speaks the real stream-json
# format (replaying captured fixtures) and calls the contract socket, so the
# Claude adapter can be exercised end to end with no network and no LLM.
[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

# A scripted stand-in for the `codex` CLI, the counterpart of fake-claude: it
# prints `codex exec --json` events and calls the contract socket.
[[bin]]
name = "fake-codex"
path = "src/bin/fake-codex.rs"

# A stand-in for GitHub's REST API over a directory of JSON files, for exit
# tests: the issue listing (with an ETag of its content), each issue's
# "blocked by" relationship (which can change without the ETag changing, as on
# GitHub), comments and closing. Loopback only.
[[bin]]
name = "fake-github"
path = "src/bin/fake-github.rs"
