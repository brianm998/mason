[package]
name = "mason-protocol"
description = "The MASON client protocol: protobuf messages and their JSON mapping"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pbjson = "0.9"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = "0.28"

[build-dependencies]
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
