# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "mason-step-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mason-platform = { version = "0.0.0", path = "../platform" }

# The tests signal processes directly.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["process", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"

[lib]
name = "mason_step_host"
path = "src/lib.rs"

[[bin]]
name = "step-host"
path = "src/bin/step-host.rs"

# Stand-in for the daemon's side, used by tests and scripts/exit/s04.sh.
[[bin]]
name = "step-host-ctl"
path = "src/bin/step-host-ctl.rs"
