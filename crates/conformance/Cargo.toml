# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "mason-conformance"
description = "Parity tooling for the monitors: feature check, design tokens, conformance runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "mason_conformance"
path = "src/lib.rs"

[[bin]]
name = "conformance"
path = "src/main.rs"

[dependencies]
mason-plugins = { version = "0.0.0", path = "../plugins" }
mason-protocol = { version = "0.0.0", path = "../protocol" }
serde_json = "1.0.154"
toml_edit = "0.25.18"

[dev-dependencies]
tempfile = "3.27.0"
