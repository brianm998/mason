#
# The one design-token file. `conformance tokens --write` generates the Swift
# and Kotlin constants from it; CI regenerates and fails on a difference, so a
# colour is changed here and nowhere else.

[color.light]
background = "#FFFFFF"
surface = "#F4F5F7"
text = "#14171A"
text_muted = "#5C6670"
accent = "#2F6FED"
attention = "#D93A3A"
attention_tint = "#FDECEC"
slow = "#C98200"
ok = "#1E8E4E"
border = "#D7DBE0"
# CPU by task (home page bar and legend): ten task colours, distinct for common colour-blindness
# (an Okabe-Ito based set), a neutral for each fixed bucket, and the bar's idle track.
cpu_1 = "#0072B2"
cpu_2 = "#E69F00"
cpu_3 = "#009E73"
cpu_4 = "#CC79A7"
cpu_5 = "#D55E00"
cpu_6 = "#56B4E9"
cpu_7 = "#7A5195"
cpu_8 = "#8C6D1F"
cpu_9 = "#B8A600"
cpu_10 = "#2B2B2B"
cpu_masond = "#5C6670"
cpu_monitor = "#8794A0"
cpu_sccache = "#A9B3BC"
cpu_other = "#C5CBD1"
cpu_idle = "#E8EAED"

[color.dark]
background = "#101214"
surface = "#1A1D21"
text = "#ECEEF0"
text_muted = "#9AA4AE"
accent = "#6C9BFF"
attention = "#FF6B6B"
attention_tint = "#3A1F1F"
slow = "#E2A93B"
ok = "#4CC38A"
border = "#2C3137"
cpu_1 = "#4DA3E0"
cpu_2 = "#F2B632"
cpu_3 = "#2FC39A"
cpu_4 = "#E39BC4"
cpu_5 = "#F0875A"
cpu_6 = "#7CC8F2"
cpu_7 = "#A98BD0"
cpu_8 = "#C9A24A"
cpu_9 = "#E6D84A"
cpu_10 = "#D9D9D9"
cpu_masond = "#9AA4AE"
cpu_monitor = "#707B86"
cpu_sccache = "#56606A"
cpu_other = "#3F464D"
cpu_idle = "#23272C"

[size]
# Points on macOS and iOS, dp on Android, px elsewhere.
# Minimum tile width; a tile is otherwise as wide as its label plus spacing each side.
tile_min_width = 64
tile_height = 64
sidebar_width = 300
sidebar_width_min = 220
sidebar_width_max = 640
main_width_min = 360
sidebar_handle = 8
row_height = 56
spacing_small = 4
spacing = 8
spacing_large = 16
corner_radius = 6
text_body = 14
text_small = 12
text_title = 18
text_count = 24
progress_cell = 14
# The mascot art ships at these sizes (clients/mascot.toml); views scale them with the text zoom.
mascot_icon_small = 20
mascot_icon = 24
mascot_banner_icon = 20
# Status pictures: beside a status line or an empty list (96), alone on an empty page (120).
mascot_status = 96
mascot_empty = 120
# The start image (1536 x 1024) is shown at most this wide, whole, never cropped.
mascot_start_width = 480
# The state illustration at the top of a task page (shown whole, fitted to its square).
mascot_illustration = 96

[motion]
# Milliseconds.
fast = 120
normal = 220
