# SPDX-License-Identifier: GPL-3.0-or-later
#
# The iOS app project, the reviewable source for XcodeGen (`make ios`). The generated
# MasonIOS.xcodeproj is not committed. One universal app: iPhone (portrait) and iPad (landscape).
name: MasonIOS
options:
  bundleIdPrefix: dev.mason
  deploymentTarget:
    iOS: "17.0"
packages:
  MasonMonitor:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MASON_IOS_BUNDLE_ID: dev.mason.ios
    DEVELOPMENT_TEAM: ""
targets:
  MasonIOS:
    type: application
    platform: iOS
    sources:
      - path: MasonIOS
        excludes:
          - Info.plist
          - MasonIOS.entitlements
    dependencies:
      - package: MasonMonitor
        product: MonitorCore
      - package: MasonMonitor
        product: MonitorPhone
      - package: MasonMonitor
        product: MonitorUI
      - package: MasonMonitor
        product: MasonMascot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MASON_IOS_BUNDLE_ID)
        INFOPLIST_FILE: MasonIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: MasonIOS/MasonIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
