# The iOS app (one universal app built from clients/swift; iPad landscape, iPhone portrait) is the
# third column, `ios`. "done" means the feature appears on both the iPad and the iPhone. Where it
# does not, `ios = "difference"` and `ios_ipad` / `ios_iphone` each say "done" or name a table
# below: `ipad.*` for the iPad, `phone.*` for the iPhone. Each such table needs a
# `platform_reason`, and the gate fails on a missing one or an unknown name.
#
# The Android phone app (clients/compose/android) is the fourth column, `android`. It is a phone
# only, so its deliberate differences are the `phone.*` tables: `android = "difference"` and
# `android_phone` names one. `todo` and `n/a` each need an `android_reason`; a `todo` is a feature
# the Android app does not have yet, recorded rather than hidden (docs/stages/s469.md).
[phone.graph-editing]
status = "deliberate-difference"
description = "The pipeline editor's graph canvas"
platform_reason = "A canvas of lanes and nodes needs a pointer and a large screen; on a phone the pipeline is read-only text and the Mac or desktop monitor edits it"

[phone.log-deep-dives]
status = "deliberate-difference"
description = "Full step logs, search inside them and the run-by-run history"
platform_reason = "Long logs are not readable on a phone; the task detail shows the log tail only"

[ipad.agent-sessions]
status = "deliberate-difference"
description = "Opening, attaching to and typing into an agent's session"
platform_reason = "An iPad has no terminal, so PlatformFeatures.iPad turns agentSessions off and the open_session action is hidden"

[ipad.graph-editing]
status = "deliberate-difference"
description = "The pipeline editor's graph canvas"
platform_reason = "The pipeline graph is read-only on the iPad; PlatformFeatures.iPad turns graphEditing off and the edit controls are absent, not disabled"

[phone.agent-sessions]
status = "deliberate-difference"
description = "Opening, attaching to and typing into an agent's session"
platform_reason = "A session needs a keyboard and a terminal-sized view, and a phone connection that drops would leave one half-driven"

