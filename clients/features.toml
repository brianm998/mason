#
# Every feature of the monitor and its status in each client: "done", "todo"
# or "n/a". CI (`conformance features clients/features.toml`) fails if a
# feature is done in one client and not in the other without a recorded
# `platform_reason`, and if anything is "n/a" without one. This is how the two
# clients stay in parity by machine check rather than by convention (Part 17).

