# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/brianm998/mason"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Line tables keep file and line in panics and backtraces; full debug info only
# slowed rustc and the linker and filled the target dir. For full info locally:
# CARGO_PROFILE_DEV_DEBUG=2 cargo test (see docs/self-hosting.md).
[profile.dev]
debug = "line-tables-only"
# "unpacked" (the macOS default) leaves every codegen unit's .o in target/debug/deps, one more set
# per crate hash: 204,381 files in one task dir. "packed" folds the debug info into a .dSYM and
# removes them (decision 0482).
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
