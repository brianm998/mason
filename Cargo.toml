# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/brianm998/mason"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Line tables keep file and line in panics and backtraces; full debug info only
# slowed rustc and the linker and filled the target dir. For full info locally:
# CARGO_PROFILE_DEV_DEBUG=2 cargo test (see docs/self-hosting.md).
[profile.dev]
debug = "line-tables-only"
# split-debuginfo stays at the macOS default ("unpacked", which keeps line numbers in backtraces):
# "packed" broke the daemon build here (E0463 through sccache) and "off" loses the lines. The
# per-hash .rcgu.o sets are pruned before each suite build instead (decision 0482).

[profile.dev.package."*"]
debug = false
