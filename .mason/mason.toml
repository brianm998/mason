schema = 1
# MASON's own pipeline, for MASON working on this repository (Stage 17).
# It is the built-in graph written out, so that a change to it is a change to a
# gate: this directory is protected, and a change here waits for the owner.
start = "explore"
explored_entry = "develop"

# Workspace builds and test runs. The owner's limit (`mason resources limit compile N`)
# takes precedence over this count.
[resource.compile]
count = 2

[step.explore]
type = "agent"
category = "exploring"
agent = "fast"
next = "develop"

[step.develop]
type = "agent"
category = "developing"
agent = "deep"
budget = "4h"
next = "test"

# Workspace test runs, after their build. Two at once; the owner's limit
# (`mason resources limit test-suite N`) takes precedence over this count.
[resource.test-suite]
count = 2

# The project's `test` command (the whole workspace) runs here, the waits outside the step's
# timeout (s61). With the overlay's `build`, the build holds one `compile` slot and gives it
# back, and the tests hold only `test-suite` (decision 0130); without it, the run holds both.
[step.test]
type = "test"
category = "testing"
uses = { compile = 1, test-suite = 1 }
max_rounds = 3
on_red = "develop"
next = "land"

[step.land]
type = "landing"
category = "landing"
max_rounds = 3
on_red = "develop"
