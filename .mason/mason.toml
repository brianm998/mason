# SPDX-License-Identifier: GPL-3.0-or-later
schema = 1
# MASON's own pipeline, for MASON working on this repository (Stage 17).
# It is the built-in graph written out, so that a change to it is a change to a
# gate: this directory is protected, and a change here waits for the owner.
start = "explore"
explored_entry = "develop"

# Workspace builds and test runs. The owner's limit (`mason resources limit compile N`)
# takes precedence over this count.
[resource.compile]
count = 2

[step.explore]
type = "agent"
category = "exploring"
agent = "fast"
next = "develop"

[step.develop]
type = "agent"
category = "developing"
agent = "deep"
budget = "4h"
next = "test"

# Workspace test runs, after their build. Two at once; the owner's limit
# (`mason resources limit test-suite N`) takes precedence over this count.
[resource.test-suite]
count = 2

# A scoped `run_check` (changed, tests or packages) takes this instead of `test-suite`, so a short
# check does not queue behind a full run (s248).
[resource.test-small]
count = 2

# Each suite builds first (`build`), so the step holds a `compile` slot only while compiling. Before
# this, a `cargo test` held its compile slot through every integration test, mostly idle, while the
# compile queue waited (2026-11-12). The running daemon has known `build` since s178 (70f66d6).
#
# The test step runs suites (s178). Each suite's `build` holds one `compile` slot and gives it
# back; its command then holds the rest of `uses` (test-suite here) and the suite's own
# (decision 0130, per suite). `{project_test}` is the project file's `test` command, so the owner's
# per-worktree CARGO_TARGET_DIR (set there, or in the environment) applies to the cargo suite.
# `run_check` runs the suites bound to `development` that the impact map selects for the
# worktree's changes; the project file's `test =` stays the command of any step without suites.
[step.test]
type = "test"
category = "testing"
uses = { compile = 1, test-suite = 1 }
suites = ["cargo-workspace", "swift-clients", "compose-clients", "exit-scripts", "fmt"]
max_rounds = 3
on_red = "develop"
next = "land"

# The workspace's tests: cargo's own lines, one test each (doc tests included). The commands run
# the executables one after another. scripts/test-parallel.py (s248) can run them side by side:
# point `command` and `dev_command` at `python3 -I scripts/test-parallel.py -- {project_test}` (and
# `{packages}`) and set MASON_TEST_JOBS if the machine has headroom; decision 0243 says why it is off.
[suite.cargo-workspace]
build = "{project_test} --no-run"
# Per-test times (s634, decision 0627): libtest's `--report-time` ends each result line in
# `<1.234s>`. Stable libtest accepts it only with RUSTC_BOOTSTRAP=1 in the test process's own
# environment, so the variable goes to the test executables through a cargo `runner` and to the
# doc tests through `RUSTDOC`, never to cargo or rustc: anyhow, thiserror and proc-macro2 rerun
# their build scripts when it changes, and a run or build that differs from the last recompiles
# most of the workspace (the in-test `cargo build` of tests/support strips it for the same reason).
command = '''RUSTDOC="$PWD/scripts/rustdoc-bootstrap.sh" {project_test} --config 'target."cfg(unix)".runner=["env","RUSTC_BOOTSTRAP=1"]' -- -Z unstable-options --report-time'''
rerun = "{project_test} -- --exact {tests}"
# The affected tests, not the whole workspace (decision 0539, superseding 0205). `{tests_for_change}`
# is the test targets a change can affect, found by a static source scan (crates/daemon/src/affected.rs):
# a changed test file runs itself, a changed `src` file runs its crate's unit tests and the targets
# of that crate and its dependents that mention it; Cargo.*, build.rs, tests/support and the like run
# everything. `run_check` with `changed: true` runs that set. With `narrow_packages` the test step
# runs it too, plus the smoke set in `.mason/smoke-tests.txt` (owner-edited). The whole suite runs
# once per landing batch (`[[tier]] batch` in landing.toml).
# `: {packages}` is a no-op that a daemon older than s546 needs to accept the key.
dev_command = ''': {packages}; RUSTDOC="$PWD/scripts/rustdoc-bootstrap.sh" {project_test} {tests_for_change} --config 'target."cfg(unix)".runner=["env","RUSTC_BOOTSTRAP=1"]' -- -Z unstable-options --report-time'''
dev_build = ": {packages}; {project_test} {tests_for_change} --no-run"
narrow_packages = true
parser = "regex"
pass_regex = '^test (.+) \.\.\. ok(?: <[0-9.]+s>)?$'
fail_regex = '^test (.+) \.\.\. FAILED(?: <[0-9.]+s>)?$'
min_tests = 100
level = "unit"
uses = { test-suite = 1 }

[suite.swift-clients]
build = "cd clients/swift && swift build --build-tests"
command = "cd clients/swift && swift test"
parser = "xctest"
min_tests = 1
level = "unit"
uses = { test-suite = 1 }

# Read from Gradle's JUnit XML, not its console: Gradle 9 prints no per-test lines even at --info, and it
# skips `test` as up to date when the worktree already ran it (an agent's run_check does). Both gave 0 tests,
# and six tasks failed `compose-clients` on 2026-11-12. `cleanTest` forces the run; the per-class XML files are
# joined into one file for `results_file`, and Gradle's exit status is kept.
[suite.compose-clients]
build = "cd clients/compose && gradle testClasses --console=plain"
command = '''cd clients/compose && gradle cleanTest test --console=plain; rc=$?; mkdir -p build; { echo '<testsuites>'; for f in */build/test-results/test/TEST-*.xml; do [ -f "$f" ] && sed '1{/^<?xml/d;}' "$f"; done; echo '</testsuites>'; } > build/mason-test-results.xml; exit $rc'''
parser = "junit"
results_file = "clients/compose/build/mason-test-results.xml"
min_tests = 1
level = "unit"
uses = { test-suite = 1 }

# The exit scripts this change adds or edits, relative to its merge base (s249). One `PASS sNNN` or
# `FAIL sNNN` line per script; CI runs all of them, this runs the ones the change can have broken.
[suite.exit-scripts]
command = "bash scripts/run-changed-exit-scripts.sh"
parser = "regex"
pass_regex = '^PASS (.+)$'
fail_regex = '^FAIL (.+)$'
min_tests = 1
level = "unit"
uses = { test-suite = 1 }

# A fast formatting gate for the test step (s691): no build, no slot, a few seconds. An unformatted
# change goes back from its own test step, and `run_check` shows the develop agent the `Diff in`
# lines. Its own suite, so a skip of `cargo-workspace` does not skip it. The landing `lint` tier
# runs the same check again over the union.
[suite.fmt]
command = '''if cargo fmt --all -- --check; then echo "test fmt_clean ... ok"; else echo "test fmt_clean ... FAILED"; exit 1; fi'''
parser = "regex"
pass_regex = '^test (.+) \.\.\. ok$'
fail_regex = '^test (.+) \.\.\. FAILED$'
min_tests = 1
level = "unit"
uses = {}

# Run by the landing `lint` tier (.mason/landing.toml) over every batch, not by the test step: six
# lint errors and five unformatted files landed in two days because neither the batch's tests nor
# the rebuild of a skipped batch ran them (s521).
[suite.lint]
command = "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings"
parser = "regex"
pass_regex = '^$'
fail_regex = '^error'
min_tests = 1
# Not "unit": [binding.unit] would also bind it to run_check and the test step. No binding
# names this level, so only the landing tier runs it.
level = "landing"

[binding.unit]
when = ["development", "test_step"]

# Which suites a change needs. A path no line names runs everything. Docs-only changes still
# select the cargo suite, which then runs only the smoke set per task (decisions 0173, 0539); the
# landing batch runs it whole.
[impact]
"crates/**" = ["cargo-workspace", "fmt"]
"Cargo.*" = ["cargo-workspace"]
"rust-toolchain.toml" = ["cargo-workspace"]
"scripts/exit/**" = ["cargo-workspace", "exit-scripts"]
"clients/swift/**" = ["swift-clients"]
"clients/compose/**" = ["compose-clients"]
"clients/features.toml" = ["cargo-workspace", "swift-clients", "compose-clients"]
"clients/tokens.toml" = ["cargo-workspace", "swift-clients", "compose-clients"]
"schemas/**" = ["cargo-workspace", "swift-clients", "compose-clients"]
"docs/**" = ["cargo-workspace"]
"**/*.md" = ["cargo-workspace"]

[step.land]
type = "landing"
category = "landing"
max_rounds = 3
on_red = "develop"

# The base branch's own GitHub CI is watched (s524, decision 0517). `gate = "CI"` is every job in the
# CI workflow (the watch takes one workflow, or one `workflow/job`): a red there files at once. Other
# workflows (Android, iOS) are watched with the default agreement. The freeze is off: MASON lands
# `direct` and fixes its own CI through the pipeline, so freezing on a red gate would stop the tasks
# that fix it. Turn it on with `freeze_on_gate = true`. It also needs a `[ci]` section of kind
# `github-actions` in the machine's project file for `mason`.
[watch.ci]
enabled = true
gate = "CI"
freeze_on_gate = false
max_open_auto = 2
