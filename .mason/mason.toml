# SPDX-License-Identifier: GPL-3.0-or-later
schema = 1
# MASON's own pipeline, for MASON working on this repository (Stage 17).
# It is the built-in graph written out, so that a change to it is a change to a
# gate: this directory is protected, and a change here waits for the owner.
start = "explore"
explored_entry = "develop"

# Workspace builds and test runs. The owner's limit (`mason resources limit compile N`)
# takes precedence over this count.
[resource.compile]
count = 2

[step.explore]
type = "agent"
category = "exploring"
agent = "fast"
next = "develop"

[step.develop]
type = "agent"
category = "developing"
agent = "deep"
budget = "4h"
next = "test"

# Workspace test runs, after their build. Two at once; the owner's limit
# (`mason resources limit test-suite N`) takes precedence over this count.
[resource.test-suite]
count = 2

# Each suite builds first (`build`), so the step holds a `compile` slot only while compiling. Before
# this, a `cargo test` held its compile slot through every integration test, mostly idle, while the
# compile queue waited (2026-11-12). The running daemon has known `build` since s178 (70f66d6).
#
# The test step runs suites (s178). Each suite's `build` holds one `compile` slot and gives it
# back; its command then holds the rest of `uses` (test-suite here) and the suite's own
# (decision 0130, per suite). `{project_test}` is the project file's `test` command, so the owner's
# per-worktree CARGO_TARGET_DIR (set there, or in the environment) applies to the cargo suite.
# `run_check` runs the suites bound to `development` that the impact map selects for the
# worktree's changes; the project file's `test =` stays the command of any step without suites.
[step.test]
type = "test"
category = "testing"
uses = { compile = 1, test-suite = 1 }
suites = ["cargo-workspace", "swift-clients", "compose-clients"]
max_rounds = 3
on_red = "develop"
next = "land"

# The workspace's tests: cargo's own lines, one test each (doc tests included).
[suite.cargo-workspace]
build = "{project_test} --no-run"
command = "{project_test}"
rerun = "{project_test} {tests}"
# `run_check` while developing, asked for with `changed: true`: only the crates the diff touches
# and their dependents. The test step runs `command` whole (decision 0205). Commented out until
# the daemon with s210 is live: the daemon that validates this file when it lands does not know
# the keys yet (as with `build` in s178). A follow-up uncomments both lines.
# dev_command = "{project_test} {packages}"
# dev_build = "{project_test} {packages} --no-run"
parser = "regex"
pass_regex = '^test (.+) \.\.\. ok$'
fail_regex = '^test (.+) \.\.\. FAILED$'
min_tests = 100
level = "unit"
uses = { test-suite = 1 }

[suite.swift-clients]
build = "cd clients/swift && swift build --build-tests"
command = "cd clients/swift && swift test"
parser = "xctest"
min_tests = 1
level = "unit"
uses = { test-suite = 1 }

# Read from Gradle's JUnit XML, not its console: Gradle 9 prints no per-test lines even at --info, and it
# skips `test` as up to date when the worktree already ran it (an agent's run_check does). Both gave 0 tests,
# and six tasks failed `compose-clients` on 2026-11-12. `cleanTest` forces the run; the per-class XML files are
# joined into one file for `results_file`, and Gradle's exit status is kept.
[suite.compose-clients]
build = "cd clients/compose && gradle testClasses --console=plain"
command = '''cd clients/compose && gradle cleanTest test --console=plain; rc=$?; mkdir -p build; { echo '<testsuites>'; for f in */build/test-results/test/TEST-*.xml; do [ -f "$f" ] && sed '1{/^<?xml/d;}' "$f"; done; echo '</testsuites>'; } > build/mason-test-results.xml; exit $rc'''
parser = "junit"
results_file = "clients/compose/build/mason-test-results.xml"
min_tests = 1
level = "unit"
uses = { test-suite = 1 }

[binding.unit]
when = ["development", "test_step"]

# Which suites a change needs. A path no line names runs everything. Docs-only changes keep
# the cargo suite for now: running none there would relax the gate (decision 0173).
[impact]
"crates/**" = ["cargo-workspace"]
"Cargo.*" = ["cargo-workspace"]
"rust-toolchain.toml" = ["cargo-workspace"]
"clients/swift/**" = ["swift-clients"]
"clients/compose/**" = ["compose-clients"]
"clients/features.toml" = ["cargo-workspace", "swift-clients", "compose-clients"]
"clients/tokens.toml" = ["cargo-workspace", "swift-clients", "compose-clients"]
"schemas/**" = ["cargo-workspace", "swift-clients", "compose-clients"]
"docs/**" = ["cargo-workspace"]
"**/*.md" = ["cargo-workspace"]

[step.land]
type = "landing"
category = "landing"
max_rounds = 3
on_red = "develop"
