# How MASON lands changes to itself: a batch at a time, straight to the base,
# after the tests. Changes to gates wait for the owner before they get this far
# (see docs/self-hosting.md).
mode     = "direct"
# The window is short because MASON's own landing has no landing suites: a batch
# shares no verification, so a longer wait saves nothing (it was a median 10 min
# per task for 1.4 tasks per batch). 30s still lets tasks that finish together
# share a batch.
window   = "30s"
# Up to 10 tasks per batch (owner, 2026-11-15). Tasks arrive tested, so a red batch is rare and
# is split to find the culprit (s394); a larger batch means fewer build cycles when several
# tasks finish together.
max_size = 10
parallel = 1

# Every batch is linted before it lands, whether its tests ran or were skipped (s521): the
# `command` of each suite named here, in the batch's worktree (so its build directory is reused).
# A red parks the batch with the files and lines in its note. Not a `batch` tier: that would
# replace the build floor and the rebuild-only rule for skipped tests (s429).
[[tier]]
name   = "lint"
suites = ["lint"]
