# SPDX-License-Identifier: GPL-3.0-or-later
# How MASON lands changes to itself: a batch at a time, straight to the base,
# after the tests. Changes to gates wait for the owner before they get this far
# (see docs/self-hosting.md).
mode     = "direct"
# The whole `cargo-workspace` suite runs here, once per batch (decision 0539), so a batch now
# shares a verification and a longer wait does pay: one 22-35 min run is split over every task
# that joins. Each task's own test step runs only the tests its change affects plus the smoke set.
# 10 min is a guess to be checked against batch size and wait: the suite takes 22-35 min and
# tasks reached landing about every 2.4 h on 2026-11-17 (10 landed that day), so a window shorter
# than the run mostly collects tasks that finish while it runs, and one much longer only adds
# latency to a task waiting alone. Raise it if batches stay at 1-2 tasks.
window   = "10m"
# Up to 10 tasks per batch (owner, 2026-11-15). Tasks arrive tested, so a red batch is rare and
# is split to find the culprit (s394); a larger batch means fewer build cycles when several
# tasks finish together.
max_size = 10
parallel = 1

# What proves a change before it reaches `develop`: the whole workspace suite over the batch's
# union (the impact map still picks the swift/compose suites for their paths only, and picks
# `cargo-workspace` for any change that touches a crate). A red is rerun, blamed by impact, then
# split to find the culprit; a red the base shows too blames nobody (run_over excuses it).
[[tier]]
name   = "batch"
suites = ["cargo-workspace"]
# On since 2026-11-21, approved by the owner (s804, decision 0797). `narrow = true` runs the suite's
# `dev_command` over the batch's union plus the smoke set, and the whole suite only when the pick is
# all (`Cargo.lock`, `Cargo.toml`, `build.rs`, ...). It is refused unless the project file has a
# full-test schedule (`kind = "ci"` with `at` or `when_quiet`, s782), and batches go back to the whole
# suite while the last full test is red or older than `full_test_max_age` (default 36h) with untested
# commits since. The registration has `[schedule.full-ci]` (01:00, or after 30 quiet minutes).
# Off for a while (#938) because the daemon then running predated #785; back on 2026-11-22, owner
# approved, once masond (323ec5f) parsed the key.
narrow = true

# The exit scripts the batch can have broken, once on the merged tree (s669).
[[tier]]
name   = "exit"
suites = ["exit-scripts-landing"]

[on_red]
ladder = ["rerun-failed", "blame-by-impact", "bisect"]

# Every batch is linted before it lands, whether its tests ran or were skipped (s521): the
# `command` of each suite named here, in the batch's worktree (so its build directory is reused).
# A red parks the batch with the files and lines in its note. Separate from the `batch` tier above (s429).
[[tier]]
name   = "lint"
suites = ["lint"]
