# DRAFT of star's `.mason/landing.toml` (Stage 27, Step 1).
#
# direct-ci: ready tasks are merged into one disposable branch, the suites run over the union,
# the branch is pushed as `mason/ci/<batch>`, CI is dispatched on it, and a green result
# fast-forwards `develop`. No pull request is opened, which is star's "No pull requests for
# internal work" rule. Which workflow is dispatched is in the project registration, not here:
# `[ci] workflow = "pr-gate.yml"` in docs/examples/star.project.toml.
#
# direct-ci dispatches ONE workflow with no inputs. starpipe also dispatched macos-gate.yml and, per
# ticket, gherkin.yml with a `features` input. How those two are covered is an owner decision
# (docs/decisions/0119, decisions 1 and 2); nothing in this file covers them yet.
mode = "direct-ci"
base = "develop"
window = "20m"
max_size = 0

# The batch tier runs over the union diff before anything is pushed, so a defect that exists only in
# the combination (two tasks each adding the same set item) is found here and not on `pr-gate`.
# Only the cheap static suites: builds, test suites, t0-proto-sync and t0-gherkin-generated stay in CI.
# The impact map (mason.toml `[impact]`) narrows these to what the union diff touches.
[[tier]]
name = "batch"
suites = ["t0-pipeline-static", "t0-diff-check", "t0-i18n"]

[on_red]
# A red CI run is rerun once (the whole run: MASON does not tell an infrastructure red from a real one).
ladder = ["rerun-failed", "blame-by-impact", "bisect", "ask"]

# s213: a red in the CI job `static checks` is a red star's own `t0-pipeline-static` suite covers
# (ruff, pyright, pytest of pipeline/). MASON then finds the culprit of such a red by running that
# suite on each half of the batch locally, and dispatches CI once more only on the union without
# the culprit. A red in any other job still bisects through CI. If the suite is green here while
# CI is red, MASON says "environment difference" and asks the owner. A job red on `develop` too
# is held, not bisected.
[ci.local]
"static checks" = ["t0-pipeline-static"]
