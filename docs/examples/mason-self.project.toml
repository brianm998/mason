# `<config dir>/projects/mason.toml`: MASON working on its own repository.
# Registering it is the owner's act; nothing in the repository turns this on.
path = "/path/to/your/mason/checkout"
base = "develop"
remote = "origin"
test = "cargo test --workspace"
# The workspace has many tests that start real daemons; on a busy machine one of them can go
# red for want of a CPU. Run a red once more before it counts: green the second time is a
# recorded flake (test-r<N>.flaky in the task's directory), red twice is red (s61).
test_reruns = 1
# The diagnosis session of a failed task (s250) runs on Opus at medium effort for Claude (the
# provider's own default model at medium for Codex). `diagnose_model` is a model name the
# provider's CLI accepts, `diagnose_effort` one of its efforts; a bad effort refuses the file.
# The same pair for every project: a `[diagnose]` table in `providers/<provider>.toml`,
# `{ model = "...", effort = "..." }`. Project, then provider file, then built-in (s1000).
# diagnose_model = "opus"
# diagnose_effort = "medium"
# Where a task's build directory is, if the test command puts it outside the worktree. It must
# contain `{task}`. When the task lands the directory is removed (a canceled or failed task keeps
# its, like its worktree), and the reconcile sweep removes those of landed tasks that were missed.
# Refused, with a log line: an empty or relative path, one with `..`, the home directory or a
# parent of it, the project, a worktree or a parent of one, or a symlink. Without this line
# nothing is removed. Match your test command, e.g.
#   test = "CARGO_TARGET_DIR=$HOME/.cache/mason-target/$(basename \"$PWD\") cargo test --workspace"
task_cache = "$HOME/.cache/mason-target/{task}"

# The presence of [self] makes this MASON's own repository. Without it the project
# is an ordinary one, with no holds and no limits.
[self]
# Added to the compiled list of protected paths (a change can never remove from it).
protect = []
# Who judges a change to MASON's own rules. "review" (the default): nobody waits. A change
# that weakens a check goes back to development with what was found; one that only touches a
# protected file lands once its tests and review are green, and `mason self` records it.
# "owner": the task waits for your approval of the diff (`mason task approve N`).
# holds = "review"
# Self-tasks open at once, filed per week, and agent steps per period (the cap on spend).
max_open = 3
per_week = 10
# Counts only agent and outside tasks' steps; the owner's own are shown, not counted (0030).
max_steps = 40
period_h = 24
# After a rollback, nothing is filed for this long (and one proposal is).
cooldown_h = 24

# Importing GitHub issues as tasks. Without this section the poller never runs for the project:
# issues filed on GitHub do not become tasks, and `mason doctor` notes it. To turn it on, remove
# the leading "# " from the lines below, set `repo`, put the token where `token` points
# (never in this file: only a reference, `env:NAME` or `file:/path`), and restart `masond`.
# An issue by an owner name is imported as it is; anyone else's only once it carries `label`.
# See docs/self-hosting.md ("Importing issues").
# [tracker]
# kind = "github"
# repo = "owner/name"
# token = "env:MASON_GITHUB_TOKEN"   # or "file:/home/you/.config/mason/github-token"
# label = "mason"                    # the label that lets an outside issue in
# interval_s = 60                    # between polls (conditional: an unchanged list costs nothing)
# webhook_secret = "env:MASON_WEBHOOK_SECRET"   # optional: a relay delivering webhooks refreshes at once

# The full CI matrix (s800, decision 0793). A push to develop runs only the fast jobs (lint,
# windows); the rest of `ci.yml` (the test matrix, exit-scripts, the monitors, the device
# samples, the macOS legs) runs when this schedule dispatches it: at 01:00, or after 30 quiet
# minutes, and only when develop changed since the last full run. Add it to
# `~/.config/mason/projects/mason.toml` and run `mason project reload --project mason`.
# [schedule.full-ci]
# kind = "ci"
# workflow = "ci.yml"
# run_name = "CI: full"
# at = "01:00"
# when_quiet = "30m"
# max_tickets = 6

# A full test without a CI workflow (#783, decision 0799): every listed suite, whole, on the base
# tip, here or on GitHub (as the remote switch says), as work below every task. Omit `suites` for
# every suite of the Test step and the landing tiers. Use it instead of `full-ci` above, not beside it.
# [schedule.full-suites]
# kind = "suites"
# suites = ["cargo-workspace", "exit-scripts"]
# at = "01:00"
# when_quiet = "30m"
