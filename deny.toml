# SPDX-License-Identifier: GPL-3.0-or-later
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# Licences compatible with GPL-3.0-or-later.
allow = ["GPL-3.0-or-later", "GPL-3.0-only", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD"]
# Anything not listed above, including GPL-incompatible licences such as
# GPL-2.0-only or SSPL, is rejected.

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path dependencies carry no version

[sources]
unknown-registry = "deny"
unknown-git = "deny"
