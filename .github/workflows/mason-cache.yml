#
# Warms the build cache MASON's remote runs restore (mason-run.yml). Run branches
# (`mason/run/**`) only restore it; this is the one place it is saved: on every push to the
# base branch and once a day (GitHub drops caches unused for 7 days).
name: mason-cache

on:
  push:
    branches: [develop]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: mason-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Link the suite's target directory into the workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/target" "$HOME/.cache/mason-target"
          ln -sfn "$PWD/target" "$HOME/.cache/mason-target/$(basename "$PWD")"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mason-run
          cache-on-failure: true
      - name: Build the workspace's tests
        run: cargo test --workspace --no-run --target-dir "$HOME/.cache/mason-target/$(basename "$PWD")"
