# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# Plain pull_request trigger only. No secrets and no private
# runners, so fork PRs run untrusted code safely.
on:
  push:
    branches: [develop, "stage/**"]
  pull_request:
  # The macOS legs of exit-scripts and monitor-compose run here, not on every push
  # (decision 0204): GitHub caps an account's concurrent macOS jobs.
  schedule:
    - cron: "17 3 * * *"

# A newer push to the same ref cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bash scripts/check-spdx.sh
      # The two monitors stay in parity by machine check (Part 17).
      - run: cargo run -q -p mason-conformance -- features clients/features.toml
      - run: cargo run -q -p mason-conformance -- tokens --check
      - run: cargo run -q -p mason-conformance -- mascot --check
      - uses: EmbarkStudios/cargo-deny-action@v2

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: bash scripts/check-dco.sh "origin/${{ github.base_ref }}..HEAD"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The workspace tests alone. They took about 20 minutes by November 2026; the
    # limit still catches a hung test.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The exit scripts, in six shards per system: in one job after the workspace tests
  # they never fitted the limit, and were cut off partway through every run. Some are
  # slow on a runner (s80 runs the holds suite three times: 11-22 minutes), so a shard
  # gets an hour.
  exit-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/run-exit-scripts.sh
        env:
          MASON_EXIT_SHARD: "${{ matrix.shard }}/6"
          # The workspace suite has a job of its own (above); exit scripts skip re-running it.
          MASON_TESTS_ALREADY_RAN: "1"
          # The monitors have jobs of their own (below); these are the Rust jobs.
          MASON_SKIP_SWIFT: "1"
          MASON_SKIP_COMPOSE: "1"

  # The macOS monitor: builds, its tests, and the conformance run against
  # `masond --demo` (no window is opened on the runner).
  monitor-swift:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: MASON_NO_GUI=1 bash scripts/exit/s12.sh

  # The Compose monitor: builds, its tests, and conformance against `masond --demo`
  # (no window is opened on the runner). Desktop clients run on every system CI has.
  monitor-compose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.12" }
      - run: MASON_NO_GUI=1 bash scripts/exit/s13.sh

  # The macOS legs of the two jobs above, nightly only (decision 0204).
  exit-scripts-macos:
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/run-exit-scripts.sh
        env:
          MASON_EXIT_SHARD: "${{ matrix.shard }}/6"
          MASON_TESTS_ALREADY_RAN: "1"
          MASON_SKIP_SWIFT: "1"
          MASON_SKIP_COMPOSE: "1"

  monitor-compose-macos:
    if: github.event_name == 'schedule'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.12" }
      - run: MASON_NO_GUI=1 bash scripts/exit/s13.sh
