name: CI

# Plain pull_request trigger only. No secrets and no private
# runners, so fork PRs run untrusted code safely.
on:
  push:
    branches: [develop, "stage/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bash scripts/check-spdx.sh
      # The two monitors stay in parity by machine check (Part 17).
      - run: cargo run -q -p mason-conformance -- features clients/features.toml
      - run: cargo run -q -p mason-conformance -- tokens --check
      - run: cargo run -q -p mason-conformance -- mascot --check
      - uses: EmbarkStudios/cargo-deny-action@v2

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: bash scripts/check-dco.sh "origin/${{ github.base_ref }}..HEAD"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The budget for the whole local suite is enforced here: the job is killed,
    # and CI fails, if build, tests and exit scripts exceed it. It was 10 minutes
    # until Stage 15 brought macOS to 9m30s; the repository is public, so runner
    # minutes cost nothing, and 20 leaves room while still catching a hung job.
    # By November 2026 the workspace tests alone took 18 minutes on macOS, so the
    # exit scripts were cut off every run; 45 restores the headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: bash scripts/run-exit-scripts.sh
        env:
          # The workspace suite just ran; exit scripts skip re-running it.
          MASON_TESTS_ALREADY_RAN: "1"
          # The Swift monitor has a job of its own (below); this one is the Rust job.
          MASON_SKIP_SWIFT: "1"
          MASON_SKIP_COMPOSE: "1"

  # The macOS monitor: builds, its tests, and the conformance run against
  # `masond --demo` (no window is opened on the runner).
  monitor-swift:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: MASON_NO_GUI=1 bash scripts/exit/s12.sh

  # The Compose monitor: builds, its tests, and conformance against `masond --demo`
  # (no window is opened on the runner). Desktop clients run on every system CI has.
  monitor-compose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.12" }
      - run: MASON_NO_GUI=1 bash scripts/exit/s13.sh
