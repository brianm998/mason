# SPDX-License-Identifier: GPL-3.0-or-later
name: Android

# Builds the Android phone app's debug APK and runs its unit tests (JVM only: no emulator, no
# device, no signing) when the Android module or the Compose core it shares changes. A workflow of
# its own so the path filter is possible (ci.yml must run on every change); a newer push cancels
# the older run.
on:
  pull_request:
    paths:
      - "clients/compose/android/**"
      - "clients/compose/core/**"
      - "clients/compose/*.kts"
      - "clients/compose/gradle.properties"
      - "schemas/**"
      - ".github/workflows/android.yml"
  push:
    branches: [develop]
    paths:
      - "clients/compose/android/**"
      - "clients/compose/core/**"
      - "clients/compose/*.kts"
      - "clients/compose/gradle.properties"
      - "schemas/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with: { gradle-version: "8.12" }
      # The runner image carries the Android SDK (ANDROID_HOME). Build and unit tests only.
      - run: gradle --no-daemon -Pmason.android=true :android:assembleDebug :android:testDebugUnitTest
        working-directory: clients/compose
