# SPDX-License-Identifier: GPL-3.0-or-later
#
# MASON's remote run workflow: put this file at .github/workflows/mason-run.yml on the base
# branch. MASON pushes a snapshot of a worktree to `mason/run/<project>/<id>`; this workflow
# runs the suite or check named in `.mason/run.json` and uploads what MASON needs to judge it:
# the combined output, the exit code, the times and the results file.
#
# MASON replaces this file in every snapshot with the base branch's copy and removes every
# other workflow from it, so a task cannot change how it is judged. `.mason/run.json` is
# written by MASON from the project's pinned definition; nothing here reads how to judge a run
# from the task's own files.
#
# Fill in the "setup" step for the project: toolchains and caches. For a Rust project use
#
#     - uses: dtolnay/rust-toolchain@stable
#     - uses: Swatinem/rust-cache@v2
#       with:
#         shared-key: mason-run
#         save-if: ${{ github.ref == 'refs/heads/develop' }}
#         cache-on-failure: true
#
# `cache-on-failure: true` matters: by default rust-cache saves its cache only after a green
# job, so a red or cut-off suite would never warm it and every run would build from scratch.
name: mason-run

on:
  push:
    branches: ["mason/run/**"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.p.outputs.runs_on }}
      timeout_min: ${{ steps.p.outputs.timeout_min }}
      matrix: ${{ steps.p.outputs.matrix }}
      sharded: ${{ steps.p.outputs.sharded }}
      toolchains: ${{ steps.p.outputs.toolchains }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: p
        run: |
          echo "runs_on=$(jq -c .runs_on .mason/run.json)" >> "$GITHUB_OUTPUT"
          echo "timeout_min=$(jq -c .timeout_min .mason/run.json)" >> "$GITHUB_OUTPUT"
          # A suite split across runners (#701) has one job per shard, numbered from 1; a run
          # that is not sharded has the one job `run`.
          echo "matrix=$(jq -c '.matrix // [1]' .mason/run.json)" >> "$GITHUB_OUTPUT"
          # The toolchains the run's suite needs (rust, java, swift); only those are set up.
          echo "toolchains=$(jq -c '.toolchains // ["rust"]' .mason/run.json)" >> "$GITHUB_OUTPUT"
          echo "sharded=$(jq -r '(.shards // 1) > 1' .mason/run.json)" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    # MASON finds the job by this name: `run`, or `run (3)` for shard 3.
    name: ${{ needs.plan.outputs.sharded == 'true' && format('run ({0})', matrix.shard) || 'run' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    strategy:
      # A red shard must not cancel the others: every test still runs.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # MASON's own setup, for its four suites: Rust (the workspace and the exit scripts), Swift
      # (clients/swift, macOS runners) and Gradle (clients/compose).
      - uses: dtolnay/rust-toolchain@master
        if: contains(fromJSON(needs.plan.outputs.toolchains), 'rust')
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      # The suites build into $HOME/.cache/mason-target/<checkout dir>, which rust-cache does
      # not cache; point it at the workspace's ./target, which it does.
      - name: Link the suite's target directory into the workspace
        if: contains(fromJSON(needs.plan.outputs.toolchains), 'rust')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/target" "$HOME/.cache/mason-target"
          ln -sfn "$PWD/target" "$HOME/.cache/mason-target/$(basename "$PWD")"
      # One shared key for every MASON run. Run branches only restore; mason-cache.yml saves it
      # from the base branch, so the ref-scoped caches of hundreds of run branches never pile up.
      - uses: Swatinem/rust-cache@v2
        if: contains(fromJSON(needs.plan.outputs.toolchains), 'rust')
        with:
          shared-key: mason-run
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          cache-on-failure: true
      - name: Select Xcode
        if: runner.os == 'macOS' && contains(fromJSON(needs.plan.outputs.toolchains), 'swift')
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the version the run asks for (run.json's `xcode`, else 16.4); the runner image
          # may not have it (macos-26 does not), and then its default Xcode is used.
          want="$(jq -r '.xcode // empty' .mason/run.json)"
          want="${want:-16.4}"
          xcode="/Applications/Xcode_${want}.app"
          if [ -d "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          else
            echo "Xcode $want is not on this runner image; using the image's default Xcode instead" >&2
            xcode-select -p >/dev/null 2>&1 || { echo "no Xcode is installed on this runner" >&2; exit 1; }
          fi
          xcodebuild -version
      - uses: actions/setup-java@v4
        if: contains(fromJSON(needs.plan.outputs.toolchains), 'java')
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        if: contains(fromJSON(needs.plan.outputs.toolchains), 'java')
        with: { gradle-version: "8.12" }

      - name: run
        shell: bash
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout_min) }}
        run: |
          set +e
          out="$RUNNER_TEMP/mason-out"
          mkdir -p "$out/results"
          : > "$out/output.log"
          # The environment MASON sets for the command.
          eval "$(jq -r '.env | to_entries[] | "export \(.key)=\(.value | @sh)"' .mason/run.json)"
          build="$(jq -r '.build // empty' .mason/run.json)"
          command="$(jq -r '.command' .mason/run.json)"
          if [ "$(jq -r '(.shards // 1) > 1' .mason/run.json)" = true ]; then
            # This job's share (#701): the command reads .mason/run.json and MASON_SHARD.
            export MASON_SHARD="${{ matrix.shard }}"
            export MASON_SHARDS="$(jq -r '.shards' .mason/run.json)"
            command="$(jq -r '.shard_command // .command' .mason/run.json)"
          fi
          results="$(jq -r '.results_file // empty' .mason/run.json)"
          code=0; build_s=0; run_s=0; phase=run
          if [ -n "$build" ]; then
            t0=$(date +%s)
            sh -c "$build" 2>&1 | tee -a "$out/output.log"
            code=${PIPESTATUS[0]}
            build_s=$(( $(date +%s) - t0 ))
            if [ "$code" -ne 0 ]; then phase=build; fi
          fi
          if [ "$code" -eq 0 ]; then
            t0=$(date +%s)
            sh -c "$command" 2>&1 | tee -a "$out/output.log"
            code=${PIPESTATUS[0]}
            run_s=$(( $(date +%s) - t0 ))
          fi
          # The results file(s) the suite reads, with their paths.
          if [ -n "$results" ]; then
            # shellcheck disable=SC2086
            tar cf - $results 2>/dev/null | tar xf - -C "$out/results"
          fi
          signal=0
          if [ "$code" -gt 128 ]; then signal=$(( code - 128 )); fi
          jq -n --argjson code "$code" --argjson signal "$signal" \
             --argjson build_s "$build_s" --argjson run_s "$run_s" --arg phase "$phase" \
             '{code: $code, signal: $signal, build_s: $build_s, run_s: $run_s, phase: $phase}' > "$out/result.json"

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.sharded == 'true' && format('mason-run-{0}', matrix.shard) || 'mason-run' }}
          path: ${{ runner.temp }}/mason-out
          if-no-files-found: error

      # The verdict is result.json, which MASON reads from the artifact. A red suite
      # does not fail the run (GitHub emails the owner for every failed run); only a
      # run that never produced a result.json does.
      - name: verdict
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/mason-out/result.json"
          if ! jq -e '.code | numbers' "$f" >/dev/null 2>&1; then
            echo "no result.json" >&2
            exit 1
          fi
          echo "verdict: code $(jq -r .code "$f"), phase $(jq -r '.phase // "?"' "$f"), run $(jq -r '.run_s // 0' "$f")s" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
