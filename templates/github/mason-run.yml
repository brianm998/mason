# SPDX-License-Identifier: MIT
#
# MASON's remote run workflow: put this file at .github/workflows/mason-run.yml on the base
# branch. MASON pushes a snapshot of a worktree to `mason/run/<project>/<id>`; this workflow
# runs the suite or check named in `.mason/run.json` and uploads what MASON needs to judge it:
# the combined output, the exit code, the times and the results file.
#
# MASON replaces this file in every snapshot with the base branch's copy and removes every
# other workflow from it, so a task cannot change how it is judged. `.mason/run.json` is
# written by MASON from the project's pinned definition; nothing here reads how to judge a run
# from the task's own files.
#
# Fill in the "setup" step for the project: toolchains and caches. For a Rust project use
#
#     - uses: dtolnay/rust-toolchain@stable
#     - uses: Swatinem/rust-cache@v2
#       with:
#         cache-on-failure: true
#
# `cache-on-failure: true` matters: by default rust-cache saves its cache only after a green
# job, so a red or cut-off suite would never warm it and every run would build from scratch.
name: mason-run

on:
  # MASON pushes the snapshot ref and then dispatches this workflow on it (a push to
  # `mason/run/**` must NOT start it: that would start every run twice). The inputs are the
  # shard list and the runner, so the run is one wave of jobs with no planning job in front.
  workflow_dispatch:
    inputs:
      runs_on:
        description: "the runner label, as JSON (must equal .mason/run.json's runs_on)"
        required: true
        type: string
      matrix:
        description: "the shard numbers, as JSON (must equal .mason/run.json's matrix)"
        required: true
        type: string
      timeout_min:
        description: "the step limit in minutes (must equal .mason/run.json's timeout_min)"
        required: true
        type: string
      sharded:
        description: "true when the suite is split across runners"
        required: true
        type: string
      toolchains:
        description: "the toolchains to set up, as JSON (must equal .mason/run.json's toolchains)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    # MASON finds the job by this name: `run`, or `run (3)` for shard 3.
    name: ${{ inputs.sharded == 'true' && format('run ({0})', matrix.shard) || 'run' }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    strategy:
      # A red shard must not cancel the others: every test still runs.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The inputs chose the runner and the shards; run.json is what MASON pinned. A run whose
      # inputs differ from it does not go on.
      - name: inputs match run.json
        shell: bash
        env:
          IN_RUNS_ON: ${{ inputs.runs_on }}
          IN_MATRIX: ${{ inputs.matrix }}
          IN_TIMEOUT: ${{ inputs.timeout_min }}
          IN_SHARDED: ${{ inputs.sharded }}
          IN_TOOLCHAINS: ${{ inputs.toolchains }}
        run: |
          set -euo pipefail
          bad=0
          same() {
            if [ "$2" != "$3" ]; then
              echo "input $1 is '$2' but .mason/run.json says '$3'; refusing to run" >&2
              bad=1
            fi
          }
          same runs_on "$IN_RUNS_ON" "$(jq -c .runs_on .mason/run.json)"
          same matrix "$IN_MATRIX" "$(jq -c '.matrix // [1]' .mason/run.json)"
          same timeout_min "$IN_TIMEOUT" "$(jq -c .timeout_min .mason/run.json)"
          same sharded "$IN_SHARDED" "$(jq -r '(.shards // 1) > 1' .mason/run.json)"
          same toolchains "$IN_TOOLCHAINS" "$(jq -c '.toolchains // ["rust"]' .mason/run.json)"
          exit "$bad"

      # setup: the project's toolchains and caches go here (see above).

      - name: run
        shell: bash
        timeout-minutes: ${{ fromJSON(inputs.timeout_min) }}
        run: |
          set +e
          out="$RUNNER_TEMP/mason-out"
          mkdir -p "$out/results"
          : > "$out/output.log"
          # The environment MASON sets for the command.
          eval "$(jq -r '.env | to_entries[] | "export \(.key)=\(.value | @sh)"' .mason/run.json)"
          build="$(jq -r '.build // empty' .mason/run.json)"
          command="$(jq -r '.command' .mason/run.json)"
          if [ "$(jq -r '(.shards // 1) > 1' .mason/run.json)" = true ]; then
            # This job's share (#701): the command reads .mason/run.json and MASON_SHARD.
            export MASON_SHARD="${{ matrix.shard }}"
            export MASON_SHARDS="$(jq -r '.shards' .mason/run.json)"
            command="$(jq -r '.shard_command // .command' .mason/run.json)"
          fi
          results="$(jq -r '.results_file // empty' .mason/run.json)"
          code=0; build_s=0; run_s=0; phase=run
          if [ -n "$build" ]; then
            t0=$(date +%s)
            sh -c "$build" 2>&1 | tee -a "$out/output.log"
            code=${PIPESTATUS[0]}
            build_s=$(( $(date +%s) - t0 ))
            if [ "$code" -ne 0 ]; then phase=build; fi
          fi
          if [ "$code" -eq 0 ]; then
            t0=$(date +%s)
            sh -c "$command" 2>&1 | tee -a "$out/output.log"
            code=${PIPESTATUS[0]}
            run_s=$(( $(date +%s) - t0 ))
          fi
          # The results file(s) the suite reads, with their paths.
          if [ -n "$results" ]; then
            # shellcheck disable=SC2086
            tar cf - $results 2>/dev/null | tar xf - -C "$out/results"
          fi
          signal=0
          if [ "$code" -gt 128 ]; then signal=$(( code - 128 )); fi
          jq -n --argjson code "$code" --argjson signal "$signal" \
             --argjson build_s "$build_s" --argjson run_s "$run_s" --arg phase "$phase" \
             '{code: $code, signal: $signal, build_s: $build_s, run_s: $run_s, phase: $phase}' > "$out/result.json"

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.sharded == 'true' && format('mason-run-{0}', matrix.shard) || 'mason-run' }}
          path: ${{ runner.temp }}/mason-out
          if-no-files-found: error

      # The job is red when the command was, so the run reads the same in the Actions UI.
      - name: exit
        if: always()
        shell: bash
        run: exit "$(jq -r '.code // 1' "$RUNNER_TEMP/mason-out/result.json" 2>/dev/null || echo 1)"
