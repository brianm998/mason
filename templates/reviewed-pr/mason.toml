# Reviewed PR: explore, develop, tests, an LLM review, one pull request per task, CI, merge.
schema = 1
start = "explore"
explored_entry = "develop"

[step.explore]
type = "agent"
category = "exploring"
agent = "light"
next = "develop"

[step.develop]
type = "agent"
category = "developing"
agent = "deep"
budget = "4h"
next = "test"

[step.test]
type = "test"
category = "testing"
# suites: mason init fills this in
max_rounds = 3
on_red = "develop"
next = "review"

[step.review]
type = "agent"
category = "review"
agent = "light"
max_rounds = 2
on_red = "develop"
next = "land"

[step.land]
type = "landing"
category = "landing"
max_rounds = 3
on_red = "develop"
