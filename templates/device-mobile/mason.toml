# Device-tested mobile: as batched-ci, with simulator and emulator environments.
schema = 1
start = "explore"
explored_entry = "develop"

[step.explore]
type = "agent"
category = "exploring"
agent = "light"
next = "develop"

[step.develop]
type = "agent"
category = "developing"
agent = "deep"
budget = "4h"
next = "test"

[step.test]
type = "test"
category = "testing"
# suites: mason init fills this in
max_rounds = 3
on_red = "develop"
next = "review"

[step.review]
type = "agent"
category = "review"
agent = "light"
max_rounds = 2
on_red = "develop"
next = "land"

[step.land]
type = "landing"
category = "landing"
max_rounds = 3
on_red = "develop"

# Environments are leased one task at a time. Point a suite at one with `env = "..."`, for
# example:
#
#   [suite.ui]
#   command = "xcodebuild test -scheme App -destination \"id=$MASON_DEVICE\""
#   parser = "xctest"
#   min_tests = 1
#   env = "simulator"
#
# Physical phones: add `[environment.phone]` with `type = "ios-device"` or `"android-device"`.
#
# A device environment leases any ready device of its type unless you narrow it:
#   os = "17"                         # OS version prefix
#   name = "myapp-*"                  # glob on the device name (`*` any run, `?` one character)
#   exclude = ["pipeline-slot-*"]     # globs on name or id it must never lease
# Use `name` or `exclude` when another pipeline on this Mac uses its own simulators, so this
# project never boots or shuts down a device in use there.
[environment.simulator]
type = "ios-simulator"

[environment.emulator]
type = "android-emulator"
